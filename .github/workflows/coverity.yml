
name: Coverity Security Scan

on:
  push:
    branches:
      - main

  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  coverity:
    runs-on: [self-hosted, Windows, coverity]

    steps:
      - name: Checkout Source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check .NET SDK
        run: dotnet --list-sdks

      - name: Restore Dependencies
        run: dotnet restore CoverityVulnerableDemo.csproj

      - name: Coverity Scan
        uses: blackduck-inc/black-duck-security-scan@v2.11.0
        with:
          coverity_url: ${{ vars.COVERITY_URL }}
          coverity_user: ${{ secrets.COVERITY_USER }}
          coverity_passphrase: ${{ secrets.COVERITY_PASSPHRASE }}

          coverity_local: true

          coverity_build_command: >-
            dotnet build CoverityVulnerableDemo.csproj
            --configuration Release
            --no-restore
            /p:UseSharedCompilation=false

          coverity_clean_command: >-
            dotnet clean CoverityVulnerableDemo.csproj
            --configuration Release

          coverity_prComment_enabled: true
          coverity_prComment_impacts: High,Medium,Low,Audit

          github_token: ${{ secrets.GITHUB_TOKEN }}

          include_diagnostics: true
